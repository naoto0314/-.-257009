<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>賞味期限チェッカー</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

<h1>🥗 賞味期限チェッカー</h1>

<input type="text" id="food" placeholder="食品名">

<select id="category">
    <option>乳製品</option>
    <option>肉類</option>
    <option>魚介類</option>
    <option>野菜</option>
    <option>果物</option>
    <option>飲み物</option>
    <option>冷凍食品</option>
    <option>お菓子</option>
    <option>調味料</option>
    <option>その他</option>
</select>

<input type="date" id="date">

<button onclick="addFood()">追加</button>

<h2>登録一覧</h2>

<div id="list"></div>

</div>

<script src="script.js"></script>

</body>
</html>
